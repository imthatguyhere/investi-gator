[package]
name = "scheduled-tasks-reporter"
version = "0.1.0"
edition = "2021"

[dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_TaskScheduler",
    "Win32_System_Ole",
    "Win32_Security",
    "Win32_System_Variant",
]}
chrono = "0.4"
csv = "1.3"
serde = { version = "1.0", features = ["derive"] }
regex = "1.10"
wmi = "0.18.3"

[profile.release]
opt-level = 3
lto = true

[[bin]]
name = "scheduled-tasks-reporter"
path = "src/main.rs"

[[bin]]
name = "services-reporter"
path = "src/services_main.rs"

[[bin]]
name = "startup-commands-reporter"
path = "src/startup_main.rs"

[[bin]]
name = "process-reporter"
path = "src/process_main.rs"

[[bin]]
name = "logged-on-users-reporter"
path = "src/loggedon_main.rs"

[[bin]]
name = "system-uptime-reporter"
path = "src/uptime_main.rs"
