[package]
name = "investi-gator"
version = "0.1.0"
edition = "2021"

[dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_TaskScheduler",
    "Win32_System_Ole",
    "Win32_Security",
    "Win32_System_Variant",
]}
chrono = "0.4"
csv = "1.3"
serde = { version = "1.0", features = ["derive"] }
regex = "1.10"
wmi = "0.18.3"

[build-dependencies]
embed-resource = "2.4"

[profile.release]
opt-level = "z" #=-- Optimize for size.
strip = true  #=-- Strip symbols from the release binary.
lto = true
codegen-units = 1
