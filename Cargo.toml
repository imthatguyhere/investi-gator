[package]
name = "scheduled-tasks-reporter"
version = "0.1.0"
edition = "2021"

[dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_TaskScheduler",
    "Win32_System_Ole",
    "Win32_Security",
    "Win32_System_Variant",
]}
chrono = "0.4"
csv = "1.3"
serde = { version = "1.0", features = ["derive"] }
regex = "1.10"

[profile.release]
opt-level = 3
lto = true
